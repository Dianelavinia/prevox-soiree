<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#0F172A">
<title>Merci : soirée Prevox</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:-apple-system,"Helvetica Neue",Inter,Arial,sans-serif; min-height:100vh; background:linear-gradient(160deg,#0F172A 0%,#1E293B 52%,#074E48 100%); color:#fff; display:flex; align-items:center; justify-content:center; padding:28px; text-align:center; }
  .wm{ font-size:19px; font-weight:600; letter-spacing:-0.035em; margin-bottom:28px; } .wm .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:#27DBCB; margin:0 3px 0 1px; vertical-align:middle; } .wm .h{ color:#94A3B8; font-weight:400; }
  img{ width:120px; margin:0 auto 18px; display:block; }
  h1{ font-size:28px; letter-spacing:-0.02em; margin-bottom:12px; }
  p{ font-size:16px; line-height:1.5; color:#CBD5E1; max-width:340px; margin:0 auto; }
  a{ display:inline-block; margin-top:26px; color:#27DBCB; font-weight:600; text-decoration:none; }
  [hidden]{ display:none !important; }
  #cal{ margin-top:22px; display:grid; gap:10px; max-width:340px; margin-left:auto; margin-right:auto; }
  p.c{ font-size:14.5px; margin-bottom:2px; }
  a.b{ margin:0; display:flex; align-items:center; justify-content:center; min-height:50px; border-radius:14px; color:#fff; background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.22); }
  a.b.p{ background:#27DBCB; color:#0F172A; border-color:#27DBCB; }
</style></head>
<body><main>
  <div class="wm">prevox<span class="dot"></span><span class="h">health</span></div>
  <img src="robot.png" alt="">
  <h1>Merci, c'est noté.</h1>
  <p id="txt">Votre réponse a bien été transmise à Diane.</p>
  <div id="cal" hidden>
    <p class="c">Ajoutez la soirée à votre agenda :</p>
    <a class="b p" href="soiree-prevox.ics">iPhone, iPad, Mac</a>
    <a class="b" href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Soir%C3%A9e%20de%20pr%C3%A9sentation%20Prevox&dates=20261120T170000Z/20261120T200000Z&location=Karl%20Gustav%20Brasserie%20(KGB)%2C%2049%20rue%20Archim%C3%A8de%2C%2073800%20Sainte-H%C3%A9l%C3%A8ne-du-Lac&details=Pr%C3%A9sentation%20du%20projet%20Prevox%2C%20d%C3%A9monstration%20de%20l%27application%2C%20puis%20un%20verre.%20https%3A%2F%2Fsoiree.prevox.health" target="_blank" rel="noopener">Google Agenda, Android</a>
    <a class="b" href="soiree-prevox.ics">Outlook (application)</a>
  </div>
  <script>
    if(location.search.indexOf('oui')>-1){
      document.getElementById('txt').textContent="Votre réponse a bien été transmise à Diane. À très bientôt, le vendredi 20 novembre à 18h.";
      document.getElementById('cal').hidden=false;
    } else if(location.search.indexOf('non')>-1){
      document.getElementById('txt').textContent="Votre réponse a bien été transmise à Diane. Merci de l'avoir prévenue.";
    }
  </script>
  <a href="https://soiree.prevox.health">Revenir à l'invitation</a>
</main></body></html>
